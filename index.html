<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Useful links</title>
    <style>
      :root {
        --bg: #f3efe6;
        --ink: #17211b;
        --muted: #3c4a42;
        --card: #fffdf8;
        --line: #e4ddd0;
        --focus: #0b57d0;
        --green: #145c3e;
        --green-soft: #e5f3eb;
        --red: #8d1d2c;
        --red-soft: #fbecee;
        --blue: #1a4f8b;
        --blue-soft: #e8f0f8;
        --amber: #8a5a12;
        --amber-soft: #f8efd9;
        --purple: #5b3d8a;
        --purple-soft: #f0eaf8;
        --teal: #0f6b63;
        --teal-soft: #e4f4f2;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        font-family: "Segoe UI", "Helvetica Neue", Arial, sans-serif;
        background:
          radial-gradient(1100px 480px at 50% -120px, #fff9f0 0%, transparent 70%),
          var(--bg);
        color: var(--ink);
        line-height: 1.35;
      }

      .wrap {
        max-width: 1120px;
        margin: 0 auto;
        padding: 40px 20px 64px;
      }

      header {
        margin-bottom: 28px;
      }

      h1 {
        margin: 0 0 8px;
        font-size: clamp(2.4rem, 5vw, 3.4rem);
        font-weight: 750;
        letter-spacing: -0.03em;
        line-height: 1.05;
      }

      .lede {
        margin: 0;
        font-size: clamp(1.15rem, 2vw, 1.35rem);
        color: var(--muted);
      }

      .links {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
        gap: 18px;
        list-style: none;
        margin: 0;
        padding: 0;
      }

      .tile {
        display: flex;
        flex-direction: column;
        min-height: 100%;
        background: var(--card);
        color: inherit;
        text-decoration: none;
        border: 2px solid var(--line);
        border-radius: 22px;
        overflow: hidden;
        transition: transform 0.15s ease, box-shadow 0.15s ease, border-color 0.15s ease;
      }

      .tile:hover {
        transform: translateY(-2px);
        border-color: color-mix(in srgb, var(--accent) 35%, var(--line));
        box-shadow: 0 10px 28px rgba(40, 32, 16, 0.1);
      }

      .tile:focus-visible {
        outline: 4px solid var(--focus);
        outline-offset: 4px;
      }

      .icon {
        display: grid;
        place-items: center;
        height: 132px;
        background: var(--accent-soft);
        color: var(--accent);
      }

      .icon svg {
        width: 72px;
        height: 72px;
      }

      .label {
        display: flex;
        flex-direction: column;
        gap: 4px;
        padding: 16px 18px 18px;
        flex: 1;
      }

      .label strong {
        font-size: 1.35rem;
        font-weight: 700;
        letter-spacing: -0.02em;
      }

      .label span {
        font-size: 1.05rem;
        color: var(--muted);
      }

      .accent-green {
        --accent: var(--green);
        --accent-soft: var(--green-soft);
      }

      .accent-red {
        --accent: var(--red);
        --accent-soft: var(--red-soft);
      }

      .accent-blue {
        --accent: var(--blue);
        --accent-soft: var(--blue-soft);
      }

      .accent-amber {
        --accent: var(--amber);
        --accent-soft: var(--amber-soft);
      }

      .accent-purple {
        --accent: var(--purple);
        --accent-soft: var(--purple-soft);
      }

      .accent-teal {
        --accent: var(--teal);
        --accent-soft: var(--teal-soft);
      }

      @media (max-width: 520px) {
        .links {
          grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
          gap: 14px;
        }

        .icon {
          height: 110px;
        }

        .icon svg {
          width: 60px;
          height: 60px;
        }

        .label strong {
          font-size: 1.2rem;
        }

        .label span {
          font-size: 0.98rem;
        }
      }

      @media (prefers-reduced-motion: reduce) {
        .tile {
          transition: none;
        }

        .tile:hover {
          transform: none;
        }
      }
    </style>
  </head>
  <body>
    <div class="wrap">
      <header>
        <h1>Useful links</h1>
        <p class="lede">Choose a card to open it.</p>
      </header>

      <main>
        <ul class="links">
          <li>
            <a class="tile accent-green" href="https://sudoku.com">
              <div class="icon" aria-hidden="true">
                <svg viewBox="0 0 72 72" fill="none">
                  <rect x="8" y="8" width="56" height="56" rx="6" stroke="currentColor" stroke-width="3" />
                  <path d="M27 10v52M45 10v52M10 27h52M10 45h52" stroke="currentColor" stroke-width="3" />
                  <path d="M18.5 10v52M36 10v52M53.5 10v52M10 18.5h52M10 36h52M10 53.5h52" stroke="currentColor" stroke-width="1.25" />
                  <g fill="currentColor" font-family="Segoe UI, Arial, sans-serif" font-size="9" font-weight="700" text-anchor="middle">
                    <text x="18.5" y="22">5</text>
                    <text x="36" y="22">3</text>
                    <text x="27" y="40">8</text>
                    <text x="53.5" y="40">2</text>
                    <text x="18.5" y="58">4</text>
                    <text x="45" y="58">7</text>
                  </g>
                </svg>
              </div>
              <div class="label">
                <strong>Sudoku</strong>
                <span>Number puzzles</span>
              </div>
            </a>
          </li>

          <li>
            <a class="tile accent-red" href="https://www.youtube.com/@channelnewsasia">
              <div class="icon" aria-hidden="true">
                <svg viewBox="0 0 72 72" fill="none">
                  <rect x="8" y="16" width="56" height="40" rx="8" fill="currentColor" />
                  <text x="36" y="38" fill="#fffdf8" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="750" text-anchor="middle">CNA</text>
                  <rect x="20" y="44" width="32" height="3" rx="1.5" fill="#fffdf8" opacity="0.9" />
                </svg>
              </div>
              <div class="label">
                <strong>Channel NewsAsia</strong>
                <span>News videos</span>
              </div>
            </a>
          </li>

          <!--
            Add more links by copying a <li> block above.
            Pick an accent class: accent-green, accent-red, accent-blue,
            accent-amber, accent-purple, or accent-teal.
          -->
        </ul>
      </main>
    </div>
  </body>
</html>
